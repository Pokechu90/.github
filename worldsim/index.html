<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorldSim</title>
  </head>
  <body>
    <div id="game"></div>

    <header id="topbar">
      <div class="time">
        <strong id="date">…</strong>
        <span id="clock">--:--</span>
        <span id="weather"></span>
        <span id="popcount"></span>
        <span id="lag" class="warn" hidden title="Your computer can't keep up with this speed, so time is running a bit slower.">⚠ slowed</span>
      </div>
      <div id="speeds" class="speeds"></div>
      <div class="world">
        <span id="actions"></span>
        Seed <code id="seed"></code>
        <button id="new-world" title="Generate a brand new world">New world</button>
      </div>
    </header>

    <aside id="panel">
      <nav id="tabs">
        <button data-tab="inspect">Inspect</button>
        <button data-tab="people">People</button>
        <button data-tab="world">World</button>
        <button data-tab="history">History</button>
      </nav>
      <section id="tab-inspect"></section>
      <section id="tab-people" hidden></section>
      <section id="tab-world" hidden></section>
      <section id="tab-history" hidden></section>
    </aside>

    <div id="chat" hidden></div>
    <dialog id="settings"></dialog>
    <dialog id="saves"></dialog>
    <div id="starmap" hidden></div>
    <div id="tooltip" hidden></div>
    <canvas id="minimap" width="200" height="160" title="Minimap: click to jump, scroll to zoom"></canvas>
    <div id="help">
      Drag / WASD: move · Wheel / + −: zoom · Click: inspect · Esc: deselect · Space: pause · 1–5: speed
    </div>
    <div id="loading">Generating world…</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
