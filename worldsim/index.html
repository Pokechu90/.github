<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorldSim</title>
  </head>
  <body>
    <div id="game"></div>

    <header id="topbar">
      <div class="time">
        <strong id="date">…</strong>
        <span id="clock">--:--</span>
        <span id="weather"></span>
        <span id="lag" class="warn" hidden title="Your computer can't keep up with this speed, so time is running a bit slower.">⚠ slowed</span>
      </div>
      <div id="speeds" class="speeds"></div>
      <div class="world">
        Seed <code id="seed"></code>
        <button id="new-world" title="Generate a brand new world">New world</button>
      </div>
    </header>

    <aside id="panel">
      <section>
        <h2>Selected</h2>
        <div id="selection"></div>
      </section>
      <section>
        <h2>Deer population</h2>
        <canvas id="history" width="268" height="64"></canvas>
      </section>
      <section>
        <h2>World</h2>
        <table id="stats"></table>
      </section>
      <section>
        <h2>History</h2>
        <ul id="events"></ul>
      </section>
    </aside>

    <div id="tooltip" hidden></div>
    <div id="help">
      Drag / WASD: move · Wheel / + −: zoom · Click: inspect · Space: pause · 1–5: speed
    </div>
    <div id="loading">Generating world…</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
